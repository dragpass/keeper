# GoReleaser publishes the Homebrew channel only.
#
# release.yml builds the macOS package, Windows installer, and Linux package.
# GoReleaser appends Darwin archives and updates the Homebrew tap.
version: 2

project_name: dragpass-keeper

builds:
  - id: keeper-darwin
    binary: dragpass-keeper
    main: .
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: darwin-tarball
    ids:
      - keeper-darwin
    formats:
      - tar.gz
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

checksum:
  # Avoid colliding with checksums.txt produced by release.yml.
  name_template: 'brew_checksums.txt'

changelog:
  # Preserve the release notes produced by release.yml.
  disable: true

release:
  # Append assets without replacing existing release content.
  mode: append

# Use a cask because the legacy brews configuration is deprecated. The
# post-install hook removes quarantine from the unsigned binary.
homebrew_casks:
  - name: keeper
    ids:
      - darwin-tarball
    repository:
      owner: dragpass
      name: homebrew-tap
      token: '{{ .Env.TAP_GITHUB_TOKEN }}'
    directory: Casks
    homepage: 'https://github.com/dragpass/keeper'
    description: 'Native key-custody helper for the DragPass Chrome Extension'
    commit_author:
      name: dragpass-release-bot
      email: vjinhyeokv@gmail.com
    binaries:
      - dragpass-keeper
    hooks:
      post:
        # Remove quarantine and install Chrome's user-level Native Messaging
        # manifest. The binary is linked into HOMEBREW_PREFIX/bin.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
                           args: ["-dr", "com.apple.quarantine", "#{staged_path}/dragpass-keeper"]
            manifest_dir = File.expand_path("~/Library/Application Support/Google/Chrome/NativeMessagingHosts")
            FileUtils.mkdir_p manifest_dir
            manifest = <<~JSON
              {
                "name": "com.dragpass.keeper",
                "description": "DragPass Device Key Storage",
                "path": "#{HOMEBREW_PREFIX}/bin/dragpass-keeper",
                "type": "stdio",
                "allowed_origins": [
                  "chrome-extension://cmgjlocmnppfpknaipdfodjhbplnhimk/"
                ]
              }
            JSON
            File.write(File.join(manifest_dir, "com.dragpass.keeper.json"), manifest)
          end
    caveats: |
      The Chrome Native Messaging manifest was installed to:
        ~/Library/Application Support/Google/Chrome/NativeMessagingHosts/com.dragpass.keeper.json
      Restart Chrome (or disable and re-enable the DragPass extension) to pick it up.

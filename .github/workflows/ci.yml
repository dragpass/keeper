name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cgo: 0
          - os: macos-14
            cgo: 1
          - os: windows-latest
            cgo: 0
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go test ./... -count=1

  # The MLS build is separate from build-test on purpose. Linking mls-rs turns
  # CGO_ENABLED on everywhere, and on Linux that compiles the real clipboard,
  # which needs the X11 headers (libX11 itself is a runtime dlopen, not a link
  # dependency). The jobs above keep the default library-free build, the one
  # used for local work, green, while this one proves the library links, runs
  # and round-trips its state on all three platforms. The release artifacts
  # themselves are built and checked by release-build.yml.
  mls:
    name: mls build + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust_target: ''
          - os: macos-14
            rust_target: ''
          # Windows releases cross-build with mingw, never MSVC, so CI has to
          # name the gnu triple rather than take the runner's default host
          # target. The other two want the default, which is where the cgo
          # directive looks for the archive.
          - os: windows-latest
            rust_target: x86_64-pc-windows-gnu
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - name: install X11 headers
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mls/target
          key: cargo-${{ matrix.os }}-${{ hashFiles('mls/Cargo.lock') }}
      - name: rust toolchain and unit tests
        run: |
          rustc --version
          cargo test --manifest-path mls/Cargo.toml
      - name: build static library
        run: |
          if [ -n "${{ matrix.rust_target }}" ]; then
            rustup target add "${{ matrix.rust_target }}"
            cargo build --release --manifest-path mls/Cargo.toml --target "${{ matrix.rust_target }}"
          else
            cargo build --release --manifest-path mls/Cargo.toml
          fi
      # The malicious-client tests (wave 5c) drive mls/examples/adversary.rs, a
      # test-only mls-rs client that is never part of a release. It runs as a
      # separate process, so the host's default target is fine on every OS.
      - name: build the test-only adversary client
        run: |
          cargo build --release --locked --example adversary --manifest-path mls/Cargo.toml
          bin=mls/target/release/examples/adversary
          if [ "${{ runner.os }}" = "Windows" ]; then bin="$bin.exe"; fi
          echo "DRAGPASS_MLS_ADVERSARY=$GITHUB_WORKSPACE/$bin" >> "$GITHUB_ENV"
      - name: go build + test with the library linked
        env:
          CGO_ENABLED: 1
        run: |
          go build -tags mls ./...
          go test -tags mls ./internal/keystore/mls/... ./internal/keystore/chatstate/ ./internal/keystore/handlers/ ./internal/keystore/dispatch/ -count=1
      # The kill harness is darwin and linux only: it kills the Keeper binary
      # with SIGKILL and reads the exit through syscall.WaitStatus, neither of
      # which exists on Windows, and it relies on a killseam build that parks
      # the process at a named point for that signal.
      - name: kill harness (real Keeper processes, SIGKILL)
        if: runner.os != 'Windows'
        env:
          CGO_ENABLED: 1
        run: go test -tags mls ./internal/keystore/killharness/ -count=1

  quality:
    name: format + vet + race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - name: install X11 headers
        run: sudo apt-get update && sudo apt-get install -y libx11-dev
      - name: gofmt
        run: test -z "$(gofmt -l $(git ls-files '*.go' ':!vendor/**'))"
      - run: go vet ./...
      - name: key bundle subprocess race tests
        run: >-
          go test -race ./internal/keystore/keychain
          -run 'TestPersonalKeyBundle(ProcessLockTimesOut|RotationSerializesAcrossProcesses|RecoversAfterRotationProcessCrash)$'
          -count=3

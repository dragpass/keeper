[package]
name = "dragpass-mls"
version = "0.0.39"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "C ABI shim that exposes mls-rs to the Keeper Go binary."

[lib]
name = "dragpass_mls"
crate-type = ["staticlib", "rlib"]

[dependencies]
# secret_tree_access + export_key_generation are neither in `default` nor in
# `rfc_compliant`, so leaving them off would compile and only fail later at the
# one place that needs them. They are what lets the send path name the
# generation it is about to consume before it consumes it (peek), and burn one
# that may or may not have been consumed after a crash (next_encryption_key).
# Without them there is no way to tell "this number was used" from "this number
# was reserved", and that difference is the whole of the (key, nonce) reuse
# defence.
#
# rustcrypto rather than the openssl provider: openssl-sys resolves through
# vcpkg, which only finds MSVC-ABI libraries, and the Windows release is built
# with mingw. A pure-Rust provider is what keeps the windows-gnu cross-build
# standing.
mls-rs = { version = "0.56.0", default-features = false, features = [
    "std",
    "rfc_compliant",
    "tree_index",
    "fast_serialize",
    "secret_tree_access",
    "export_key_generation",
] }
mls-rs-core = { version = "0.27.0", default-features = false, features = ["std"] }
mls-rs-crypto-rustcrypto = { version = "0.22.1", default-features = false, features = ["std"] }
zeroize = { version = "1", default-features = false, features = ["std"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# panic stays at the default `unwind` even though it costs binary size. Keeper
# is a long-lived native-messaging process: an abort inside a locked section
# takes the whole daemon down on input the extension merely got wrong, while an
# unwind caught at the C ABI edge becomes an error code. Every extern "C" entry
# point wraps its body in catch_unwind, which is also what keeps an unwind from
# crossing the boundary (undefined behaviour, and an abort since Rust 1.81).
